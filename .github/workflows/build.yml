name: Build

# 出**全部平台**的 jar。一次 build 全出，各平台只差字节码目标与加载器元数据，
# 数据源只有 src/ 那一份——不会为哪个整合包单独编一个。
#
# 比 CI 慢：要按 targets.json 逐个下资源蜜蜂的 jar（导览书是拿映射现套到它自带
# 那份 JSON 上生成的，非有不可），再逐个平台编译。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（x.y.z / x.y.z-beta.N / x.y.z-rc.N）'
        type: string
        required: false
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'mod/**'
      - 'scripts/**'
      - 'versions/**'
      - 'deps.lock.json'
      - 'manifest.json'

jobs:
  # 先把要出哪些平台读出来，下面按矩阵一个 runner 出一个。
  # 不能在一个 job 里串着编 20 个：每个平台 ModDevGradle 都要解一遍 Minecraft，
  # 串行既慢又吃内存（本机试过直接被 OOM 杀掉）。
  targets:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.t.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: t
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          t = json.load(open('versions/targets.json', encoding='utf-8'))
          print('list=' + json.dumps(sorted(k for k, v in t.items() if v.get('buildable'))))
          PY

  build:
    name: ${{ matrix.target }}
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.list) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 矩阵里的平台横跨 Java 8 / 17 / 21，三个都得在
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
            21

      - name: 定版本号
        id: v
        run: |
          set -euo pipefail
          v='${{ inputs.version }}'
          # 非发布构建用 0.0.0-rc.N：既满足 mods.toml 的版本形态，
          # 又一眼看得出不是正式版（N 取运行号，保证递增不重复）
          [ -n "$v" ] || v="0.0.0-rc.${GITHUB_RUN_NUMBER}"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # 资源蜜蜂的 jar 与 Gradle 都按 sha256 核过才用；缓存命中也照样核
      # （build.py 自己核，缓存里的东西同样可能是坏的）。
      - uses: actions/cache@v4
        with:
          path: |
            build/pbjars
            build/gradle
            ~/.gradle/caches
          key: deps-${{ matrix.target }}-${{ hashFiles('versions/targets.json', 'deps.lock.json') }}

      - name: 出这个平台的 jar
        run: python3 scripts/build.py '${{ steps.v.outputs.version }}' '${{ matrix.target }}'

      - name: 产物清单
        run: ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: productivebees-zh_cn-${{ steps.v.outputs.version }}-${{ matrix.target }}
          path: dist/*.jar
          if-no-files-found: error
