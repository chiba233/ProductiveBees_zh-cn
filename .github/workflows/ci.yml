name: CI

# 每个 PR / main push 都跑的**快闸**。刻意不出全部 20 个平台的 jar
# （那是 Build / Release 的活），只覆盖两类立刻能红的东西：
#   1. 数据闸：版本矩阵与 key 并集自洽，译文覆盖率没倒退
#   2. 编译闸：最新那个平台真能编出来，且对着打好的 jar 跑得过自测
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: 数据闸 + 编译闸
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 1.21.x 跑在 Java 21 上；老平台的 jar 由 Build 出，那边再装对应 JDK
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 数据自洽：targets.json 与 keys.json 是同一次扫描的产物，
      # 只改一个不改另一个，覆盖率报告就会骗人。
      - name: 版本矩阵自洽
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, sys
          t = json.loads(pathlib.Path('versions/targets.json').read_text(encoding='utf-8'))
          k = json.loads(pathlib.Path('versions/keys.json').read_text(encoding='utf-8'))
          tags = set(t)
          used = {x for v in k['lang'].values() for x in v}
          if used - tags:
              sys.exit('❌ keys.json 里引用了 targets.json 没有的目标: %s' % sorted(used - tags))
          if tags - used:
              sys.exit('❌ targets.json 里有目标一个 key 都没贡献，扫描不完整: %s'
                       % sorted(tags - used))
          print('✅ %d 个目标、%d 个 key 自洽' % (len(tags), len(k['lang'])))
          PY

      # 覆盖率只许涨不许跌。降了就是有人删了译文或者加了目标没补翻译。
      - name: 译文覆盖率
        run: python3 scripts/versions.py gap

      # 扫描器自己也要验：该收的收到、该躲的躲开、内嵌包钻得进去。
      # 只跑合成用例，不联网——真扫要下几百个整合包，那是本地干的活。
      - name: 整合包扫描器自验
        run: python3 scripts/addons.py selftest

      # 扫出来的整合包自定义 key 必须条条有译文
      - name: 整合包 key 全译过
        run: python3 scripts/addon_lang.py --check

      # README 的支持矩阵是从 versions/ 生成的，改了数据没重跑就会对不上
      - name: README 支持矩阵是最新的
        run: python3 scripts/readme.py --check

      # CHANGELOG 要在**平时**就红，不能等推了 tag 才发现发版说明是空的。
      # v1.0.0-beta.1 就是这么发出去的：CHANGELOG 里只有 `## 1.0.0-rc.1`
      # 一个谁也没发过的版本号，精确比对落空，于是发了句「说明见 CHANGELOG」。
      - name: CHANGELOG 顶上那段拿得出手
        run: |
          set -euo pipefail
          FIRST=$(awk '/^## /{sub(/^## /,""); print; exit}' CHANGELOG.md)
          [ -n "$FIRST" ] || { echo "❌ CHANGELOG.md 里一个 ## 段都没有" >&2; exit 1; }
          BODY=$(awk -v ver="## $FIRST" '
            $0 == ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md | sed '/^[[:space:]]*$/d')
          [ -n "$BODY" ] || { echo "❌ CHANGELOG 顶上那段（## $FIRST）是空的" >&2; exit 1; }
          echo "✅ 发版说明会取自 ## $FIRST（$(printf '%s\n' "$BODY" | wc -l | tr -d ' ') 行）"

      # 编一个最新平台出来，并对着**打好的那个 jar** 跑译名自测
      - name: 编译 + 自测（1.21.1 NeoForge）
        run: python3 scripts/build.py 0.0.0-rc.1 1.21.1-neoforge

      # 整合包自己加的蜂：材料名能不能从玩家装的模组里现学出来。
      # 正反两面都验——该学出的要学对，拿不准的**必须学不出**：
      # 学错是张冠李戴，学不出只是显示英文，后者可以接受。
      - name: 整合包蜂名现学自验
        run: |
          set -euo pipefail
          python3 scripts/addon_probe.py --selftest /tmp/pbzh-addon.json
          GSON=$(find build -name 'gson-*.jar' | head -1)
          [ -n "$GSON" ] || { echo "❌ 找不到 gson" >&2; exit 1; }
          mkdir -p /tmp/pbzh-an
          javac -nowarn -cp "$GSON" -d /tmp/pbzh-an \
              mod/src/main/java/cn/hoshino/pbzh/AddonNames.java \
              mod/test/TestAddonNames.java
          java -cp "/tmp/pbzh-an:$GSON" TestAddonNames /tmp/pbzh-addon.json

      - name: Python 语法
        run: python3 -m compileall -q scripts
