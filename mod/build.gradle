//
// 这是一个**真的 mod**，不是资源包套壳。
//
// 为什么非得是 mod：基因样本 tooltip 里那行蜂种名是运行期数据，
//   Component.translatable("productivebees.information.attribute.type", value)
// 的 value 是从物品 data component 里读出来的裸 String，不过任何 lang 查表。
// 资源包碰不到，VaultPatcher 也不行（它改字节码常量池，这个串不在常量池里）。
// 只能在 ItemTooltipEvent 上拦下来改——那就得有代码，那就得是 mod。
//
// 资源（lang / 导览书）与译名表都是 Python 在构建前生成到 src/main/resources 的，
// 真源在 atm10-zh-cn，按 SOURCE.lock 的 commit 钉死。这里只负责编译与打包。
// 两套加载器两个插件：新版 NeoForge（1.20.2+）走 moddev，
// Forge 与 1.20.1 的 NeoForge 走 legacyforge。用哪套由 -Plegacy 决定。
plugins {
    id 'net.neoforged.moddev' version '2.0.142' apply false
    id 'net.neoforged.moddev.legacyforge' version '2.0.142' apply false
}

def legacy = ((project.findProperty('legacy') ?: 'false') as String).toBoolean()
apply plugin: legacy ? 'net.neoforged.moddev.legacyforge' : 'net.neoforged.moddev'

version = project.findProperty('modVersion') ?: 'dev'
group = 'cn.hoshino'
base { archivesName = 'productivebees-zh_cn' }

java {
    // **必须按目标那一版 Minecraft 的 Java 出字节码**：1.20.4 及更早跑 Java 17，
    // 拿 21 的字节码给它就是 UnsupportedClassVersionError，游戏直接起不来。
    toolchain.languageVersion = JavaLanguageVersion.of(
        (project.findProperty('javaVersion') ?: '21') as Integer)
}

// 加载器胶水各有一套（事件类的包名不同：net.minecraftforge.* vs net.neoforged.*），
// 但真逻辑 BeeNames 不引用任何 Minecraft 类型，两边共用。
sourceSets.main.java.srcDirs = ['src/main/java',
                                legacy ? 'src/forge/java' : 'src/neoforge/java']

if (legacy) {
    legacyForge { version = project.findProperty('loaderVersion') ?: '1.20.1-47.4.9' }
} else {
    neoForge { version = project.findProperty('loaderVersion') ?: '21.1.241' }
}

// 产物字节要可复现：不写时间戳，条目按名字排序。
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('jar') {
    manifest {
        attributes([
            'Specification-Title'     : 'productivebees_zh_cn',
            'Specification-Vendor'    : '星野夢華 (Hoshino Yumeka)',
            'Implementation-Title'    : 'Productive Bees 简体中文汉化',
            'Implementation-Version'  : project.version,
        ])
    }
}
